<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleVibe DE | Dein TV-Guide (FreeEPG)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #09090b; 
            --bg-card: #18181b;
            --primary: #3b82f6;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --border: #27272a;
            --live-red: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding-bottom: 4rem; }

        header {
            background: rgba(9, 9, 11, 0.95); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
            padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center;
        }

        .logo { font-size: 1.6rem; font-weight: 700; color: var(--text-main); }
        .logo span { color: var(--primary); }
        .live-clock { font-size: 0.9rem; color: var(--text-muted); background: var(--bg-card); padding: 0.4rem 0.8rem; border-radius: 6px; border: 1px solid var(--border); }

        .controls-wrapper { padding: 1.5rem 5% 0; max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.25rem; }
        .scroll-row { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.5rem; scrollbar-width: none; align-items: center; }
        .scroll-row::-webkit-scrollbar { display: none; }
        .row-label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-right: 0.5rem; min-width: max-content; }

        .btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); padding: 0.5rem 1.2rem; border-radius: 8px; font-size: 0.9rem; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .btn:hover { color: var(--text-main); border-color: var(--text-muted); }
        .btn.active { background: var(--text-main); color: var(--bg-main); border-color: var(--text-main); font-weight: 600; }
        .btn-channel { border-radius: 99px; padding: 0.4rem 1.2rem; }
        .btn-channel.active { background: rgba(59, 130, 246, 0.15); border-color: var(--primary); color: var(--primary); }

        .search-input { width: 100%; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 0.7rem 1rem; border-radius: 8px; font-size: 0.95rem; outline: none; margin-top: 0.5rem; }
        .search-input:focus { border-color: var(--primary); }

        main { padding: 1.5rem 5%; max-width: 1500px; margin: 0 auto; }
        .section-header { margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 1rem; }
        .section-title { font-size: 1.3rem; font-weight: 600; }
        .show-count { color: var(--text-muted); font-size: 0.9rem; }

        .tv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem; }
        
        /* Timeline Modus */
        .tv-grid.timeline-mode { grid-template-columns: 1fr; gap: 0.75rem; }
        .tv-grid.timeline-mode .card { flex-direction: row; align-items: center; padding: 1rem 1.25rem; gap: 1rem; }
        .tv-grid.timeline-mode .card-header { margin-bottom: 0; flex-direction: column; align-items: flex-start; min-width: 120px; border-bottom: none; }
        .tv-grid.timeline-mode .card-body-wrapper { flex-grow: 1; display: flex; flex-direction: column; gap: 0.2rem; }
        .tv-grid.timeline-mode .show-desc { margin-bottom: 0; -webkit-line-clamp: 1; }

        .card { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); padding: 1.25rem; display: flex; flex-direction: column; transition: transform 0.2s, border-color 0.2s; }
        .card:hover { transform: translateY(-2px); border-color: var(--primary); }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.8rem; }
        .channel-name { font-weight: 700; font-size: 1rem; color: var(--primary); }
        .time-badge { font-size: 0.85rem; color: var(--text-main); font-weight: 600; background: rgba(255,255,255,0.05); padding: 0.25rem 0.6rem; border-radius: 6px; border: 1px solid var(--border); }
        .show-title { font-size: 1.15rem; font-weight: 600; margin-bottom: 0.3rem; line-height: 1.3; }
        .show-desc { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 1rem; }

        .progress-container { margin-top: auto; width: 100%; }
        .progress-text { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-bottom: 0.4rem; }
        .live-indicator { color: var(--live-red); font-weight: 600; display: flex; align-items: center; gap: 0.4rem; }
        .live-dot { width: 8px; height: 8px; background: var(--live-red); border-radius: 50%; animation: blink 2s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
        .progress-bar-bg { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--live-red); border-radius: 4px; }

        .no-results { grid-column: 1 / -1; text-align: center; padding: 4rem; color: var(--text-muted); background: var(--bg-card); border-radius: 12px; border: 1px dashed var(--border); font-size: 1.1rem; }

        @media (max-width: 768px) {
            .tv-grid.timeline-mode .card { flex-direction: column; align-items: flex-start; }
            .tv-grid.timeline-mode .card-header { flex-direction: row; width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TeleVibe<span>DE</span></div>
        <div class="live-clock" id="clock">00:00 Uhr</div>
    </header>

    <div class="controls-wrapper">
        <div class="scroll-row" id="dateScroll"><span class="row-label">Datum:</span></div>
        <div class="scroll-row" id="timeScroll">
            <span class="row-label">Zeit:</span>
            <button class="btn active" onclick="setTimeFilter('jetzt', this)">🔴 Jetzt Live</button>
            <button class="btn" onclick="setTimeFilter('2015', this)">20:15 Uhr</button>
            <button class="btn" onclick="setTimeFilter('2200', this)">22:00 Uhr</button>
            <button class="btn" onclick="setTimeFilter('ganzer-tag', this)">Ganzer Tag</button>
        </div>
        <div class="scroll-row" id="channelScroll">
            <span class="row-label">Sender:</span>
            <button class="btn btn-channel active" onclick="setChannelFilter('all', this)">Lade Sender...</button>
        </div>
        <input type="text" id="searchInput" class="search-input" placeholder="Nach Sendung oder Sender suchen..." oninput="applyFilters()">
    </div>

    <main>
        <div class="section-header">
            <h2 class="section-title" id="sectionTitle">Lade Programm von FreeEPG (Das kann ein paar Sekunden dauern)...</h2>
            <span class="show-count" id="showCount"></span>
        </div>
        <div class="tv-grid" id="tvGrid"></div>
    </main>

    <script>
        let realScheduleData = [];
        let availableChannels = [];
        
        let activeDateOffset = 0;
        let activeTimeFilter = 'jetzt';
        let activeChannel = 'all';

        // Hilfsfunktion: XMLTV Datumsformat (z.B. "20260906201500 +0200") in JS Date umwandeln
        function parseXmltvDate(str) {
            if (!str) return new Date();
            const year = parseInt(str.substring(0,4));
            const month = parseInt(str.substring(4,6)) - 1;
            const day = parseInt(str.substring(6,8));
            const hour = parseInt(str.substring(8,10));
            const min = parseInt(str.substring(10,12));
            const sec = parseInt(str.substring(12,14));
            return new Date(year, month, day, hour, min, sec);
        }

        // Hilfsfunktion: Führende Nullen
        function formatTime(dt) {
            return String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0');
        }

        async function fetchRealTVData() {
            try {
                // NEU: Wir rufen jetzt unseren eigenen Vercel-Rewrite auf!
                // Kein Drittanbieter-Proxy mehr nötig, kein CORS-Fehler mehr.
                const apiUrl = '/api/epg';
                
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Netzwerk-Fehler (Status ' + response.status + ')');
                
                const xmlText = await response.text();
                
                // XML im Browser parsen
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                
                // ... (Der restliche Code darunter bleibt exakt gleich wie vorher!)
                
                // 1. Alle Sender (Channels) auslesen und Mappen (ID -> Name)
                const channelMap = {};
                const channelNodes = xmlDoc.getElementsByTagName("channel");
                for (let i = 0; i < channelNodes.length; i++) {
                    const id = channelNodes[i].getAttribute("id");
                    const nameNode = channelNodes[i].getElementsByTagName("display-name")[0];
                    if (id && nameNode) {
                        channelMap[id] = nameNode.textContent;
                    }
                }

                // Extrahiere Sender für die Filter-Buttons oben (auf max. 30 begrenzen, um UI sauber zu halten)
                availableChannels = Object.values(channelMap).slice(0, 30);
                initChannelUI(); // UI updaten

                // 2. Alle Sendungen (Programme) auslesen
                const progNodes = xmlDoc.getElementsByTagName("programme");
                const today = new Date();
                today.setHours(0, 0, 0, 0); // Mitternacht heute
                
                for (let i = 0; i < progNodes.length; i++) {
                    const prog = progNodes[i];
                    const startStr = prog.getAttribute("start");
                    const stopStr = prog.getAttribute("stop");
                    const channelId = prog.getAttribute("channel");
                    
                    if (!startStr || !stopStr || !channelId) continue;

                    const startDt = parseXmltvDate(startStr);
                    const stopDt = parseXmltvDate(stopStr);
                    
                    // Berechne den Tag-Offset (0 = Heute, 1 = Morgen, etc.)
                    const showDay = new Date(startDt);
                    showDay.setHours(0, 0, 0, 0);
                    const dayOffset = Math.round((showDay - today) / (1000 * 60 * 60 * 24));
                    
                    // Wir speichern nur Daten für Heute bis in 4 Tagen um Speicherplatz zu sparen
                    if (dayOffset >= 0 && dayOffset <= 4) {
                        const titleNode = prog.getElementsByTagName("title")[0];
                        const descNode = prog.getElementsByTagName("desc")[0];
                        
                        realScheduleData.push({
                            dayOffset: dayOffset,
                            channel: channelMap[channelId] || channelId, // Richtiger Sendername
                            start: formatTime(startDt),
                            end: formatTime(stopDt),
                            title: titleNode ? titleNode.textContent : 'Unbekannt',
                            desc: descNode ? descNode.textContent : 'Keine Beschreibung'
                        });
                    }
                }

                applyFilters();

            } catch (error) {
                console.error('Fehler beim Laden von FreeEPG:', error);
                document.getElementById('tvGrid').innerHTML = `
                    <div class="no-results" style="color: var(--live-red); border-color: var(--border);">
                        <strong>Fehler beim EPG Download</strong><br>
                        Die Verbindung zu free-epg.de ist fehlgeschlagen oder die XML-Datei ist zu groß für den Browser.<br>
                        <em>Tipp: Entwicklerkonsole (F12) prüfen.</em>
                    </div>`;
                document.getElementById('sectionTitle').innerText = "Programm nicht verfügbar";
            }
        }

        function initDateUI() {
            const dScroll = document.getElementById('dateScroll');
            dScroll.innerHTML = '<span class="row-label">Datum:</span>'; // Reset
            const weekdays = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
            for(let i=0; i<5; i++) {
                const d = new Date(); d.setDate(d.getDate() + i);
                let label = i === 0 ? 'Heute' : (i === 1 ? 'Morgen' : `${weekdays[d.getDay()]}, ${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth()+1).padStart(2, '0')}.`);
                const btn = document.createElement('button');
                btn.className = i === 0 ? 'btn active' : 'btn';
                btn.innerText = label;
                btn.onclick = function() { setDateFilter(i, this); };
                dScroll.appendChild(btn);
            }
        }

        function initChannelUI() {
            const cScroll = document.getElementById('channelScroll');
            cScroll.innerHTML = '<span class="row-label">Sender:</span>'; // Reset
            
            const allBtn = document.createElement('button');
            allBtn.className = 'btn btn-channel active';
            allBtn.innerText = 'Alle Sender';
            allBtn.onclick = function() { setChannelFilter('all', this); };
            cScroll.appendChild(allBtn);

            availableChannels.forEach(channel => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-channel';
                btn.innerText = channel;
                btn.onclick = function() { setChannelFilter(channel, this); };
                cScroll.appendChild(btn);
            });
        }

        function timeToMinutes(str) { 
            if(!str || !str.includes(':')) return 0;
            const [h, m] = str.split(':').map(Number); 
            return h * 60 + m; 
        }
        function getCurrentMinutes() { const now = new Date(); return now.getHours() * 60 + now.getMinutes(); }
        
        function updateClock() { document.getElementById('clock').innerText = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr'; }
        setInterval(updateClock, 1000);

        function setDateFilter(offset, btn) {
            activeDateOffset = offset;
            document.querySelectorAll('#dateScroll .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(offset > 0 && activeTimeFilter === 'jetzt') setTimeFilter('2015', document.querySelectorAll('#timeScroll .btn')[1]);
            else applyFilters();
        }

        function setTimeFilter(type, btn) {
            activeTimeFilter = type;
            document.querySelectorAll('#timeScroll .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(type === 'jetzt' && activeDateOffset > 0) setDateFilter(0, document.querySelectorAll('#dateScroll .btn')[0]);
            else applyFilters();
        }

        function setChannelFilter(channel, btn) {
            activeChannel = channel;
            document.querySelectorAll('#channelScroll .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            if(realScheduleData.length === 0) return;

            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const titleEl = document.getElementById('sectionTitle');
            const nowMins = getCurrentMinutes();
            
            let result = realScheduleData.filter(s => s.dayOffset === activeDateOffset);
            const dateLabels = ['Heute', 'Morgen', 'Übermorgen', 'in 3 Tagen', 'in 4 Tagen'];
            let titlePrefix = dateLabels[activeDateOffset];

            if (activeTimeFilter === 'jetzt') {
                titleEl.innerText = "🔴 Jetzt Live im TV";
                result = result.filter(s => {
                    const start = timeToMinutes(s.start);
                    let end = timeToMinutes(s.end);
                    if (end < start) end += 1440; // Sendung geht über Mitternacht
                    return start <= nowMins && end > nowMins;
                });
            } else if (activeTimeFilter === '2015') {
                titleEl.innerText = `${titlePrefix}: Prime-Time (20:15 Uhr)`;
                result = result.filter(s => {
                    const start = timeToMinutes(s.start);
                    let end = timeToMinutes(s.end);
                    if (end < start) end += 1440;
                    return start <= 1215 && end > 1215;
                });
            } else if (activeTimeFilter === '2200') {
                titleEl.innerText = `${titlePrefix}: Spätprogramm (22:00 Uhr)`;
                result = result.filter(s => {
                    const start = timeToMinutes(s.start);
                    let end = timeToMinutes(s.end);
                    if (end < start) end += 1440;
                    return start <= 1320 && end > 1320;
                });
            } else if (activeTimeFilter === 'ganzer-tag') {
                titleEl.innerText = `${titlePrefix}: Komplettes Programm`;
            }

            if (activeChannel !== 'all') result = result.filter(s => s.channel === activeChannel);
            if (searchVal.trim() !== '') result = result.filter(s => s.title.toLowerCase().includes(searchVal) || s.channel.toLowerCase().includes(searchVal));

            // Sortieren nach Zeit oder nach Sender
            result.sort((a, b) => {
                if (activeTimeFilter === 'ganzer-tag') {
                    return timeToMinutes(a.start) - timeToMinutes(b.start);
                }
                // Sortieren alphabetisch nach Sendernamen, falls Live/20:15
                return a.channel.localeCompare(b.channel);
            });

            renderGrid(result);
        }

        function renderGrid(shows) {
            const grid = document.getElementById('tvGrid');
            const countEl = document.getElementById('showCount');
            const nowMins = getCurrentMinutes();
            
            grid.innerHTML = '';
            countEl.innerText = `${shows.length} Sendung(en)`;

            if (activeTimeFilter === 'ganzer-tag') grid.classList.add('timeline-mode');
            else grid.classList.remove('timeline-mode');

            if (shows.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <strong>Keine Daten.</strong><br>
                        Für diesen Filter liegen im FreeEPG aktuell keine Sendungen vor.
                    </div>`;
                return;
            }

            shows.forEach(show => {
                const startM = timeToMinutes(show.start);
                let endM = timeToMinutes(show.end);
                if (endM < startM) endM += 1440; // Mitternacht korrigieren

                const isLive = (activeDateOffset === 0 && nowMins >= startM && nowMins < endM);
                
                let progressHTML = '';
                if (isLive && activeTimeFilter !== 'ganzer-tag') {
                    const totalDuration = endM - startM;
                    const elapsed = nowMins - startM;
                    const progressPercent = Math.min(100, Math.max(0, Math.round((elapsed / totalDuration) * 100)));
                    
                    progressHTML = `
                        <div class="progress-container">
                            <div class="progress-text">
                                <span class="live-indicator"><div class="live-dot"></div> Live</span>
                                <span>${progressPercent}%</span>
                            </div>
                            <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${progressPercent}%"></div></div>
                        </div>`;
                }

                if (activeTimeFilter === 'ganzer-tag') {
                    grid.innerHTML += `
                        <div class="card">
                            <div class="card-header">
                                <span class="channel-name">${show.channel}</span>
                                <span class="time-badge">${show.start} - ${show.end}</span>
                            </div>
                            <div class="card-body-wrapper">
                                <div class="show-title" style="font-size: 1.05rem; margin-bottom: 0.1rem;">${show.title}</div>
                                <div class="show-desc">${show.desc}</div>
                            </div>
                        </div>`;
                } else {
                    grid.innerHTML += `
                        <div class="card">
                            <div class="card-header">
                                <span class="channel-name">${show.channel}</span>
                                <span class="time-badge">${show.start} - ${show.end}</span>
                            </div>
                            <div class="show-title">${show.title}</div>
                            <div class="show-desc">${show.desc}</div>
                            ${progressHTML}
                        </div>`;
                }
            });
        }

        window.onload = () => { 
            initDateUI();
            updateClock(); 
            fetchRealTVData(); 
        };
    </script>
</body>
</html>
