<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleVibe DE | Dein ultimativer TV-Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #09090b; 
            --bg-card: #18181b;
            --bg-card-hover: #27272a;
            --primary: #3b82f6;
            --accent: #60a5fa;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --border: #27272a;
            --live-red: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 4rem;
            -webkit-font-smoothing: antialiased;
        }

        /* --- HEADER --- */
        header {
            background: rgba(9, 9, 11, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .logo span {
            color: var(--primary);
        }

        .live-clock {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        /* --- CONTROLS --- */
        .controls-wrapper {
            padding: 1.5rem 5% 0;
            max-width: 1500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .scroll-row {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            scrollbar-width: none;
            align-items: center;
        }
        .scroll-row::-webkit-scrollbar { display: none; }

        .row-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 0.5rem;
            min-width: max-content;
        }

        .btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .btn:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .btn.active {
            background: var(--text-main);
            color: var(--bg-main);
            border-color: var(--text-main);
            font-weight: 600;
        }

        .btn-channel {
            border-radius: 99px;
            padding: 0.4rem 1.2rem;
            font-size: 0.85rem;
        }
        .btn-channel.active {
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--primary);
            color: var(--primary);
        }

        .search-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.7rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
            margin-top: 0.5rem;
        }
        .search-input:focus { border-color: var(--primary); }

        /* --- MAIN GRID --- */
        main {
            padding: 1.5rem 5%;
            max-width: 1500px;
            margin: 0 auto;
        }

        .section-header {
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .show-count {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .tv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.25rem;
        }

        /* Spezial-Layout für "Ganzer Tag" (Timeline-Style) */
        .tv-grid.timeline-mode {
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }

        .tv-grid.timeline-mode .card {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.25rem;
            gap: 1rem;
        }

        .tv-grid.timeline-mode .card-header {
            margin-bottom: 0;
            flex-direction: column;
            align-items: flex-start;
            min-width: 120px;
            border-bottom: none;
            padding-bottom: 0;
        }

        .tv-grid.timeline-mode .card-body-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .tv-grid.timeline-mode .show-desc {
            margin-bottom: 0;
            -webkit-line-clamp: 1; /* Nur 1 Zeile Beschreibung in der Timeline */
        }

        /* --- CARDS --- */
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.8rem;
        }

        .channel-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--primary);
        }

        .time-badge {
            font-size: 0.85rem;
            color: var(--text-main);
            font-weight: 600;
            background: rgba(255,255,255,0.05);
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .show-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            line-height: 1.3;
        }

        .show-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-container { margin-top: auto; width: 100%; }
        
        .progress-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.4rem;
        }

        .live-indicator {
            color: var(--live-red);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--live-red);
            border-radius: 50%;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; box-shadow: 0 0 8px var(--live-red); }
            50% { opacity: 0.4; box-shadow: none; }
            100% { opacity: 1; box-shadow: 0 0 8px var(--live-red); }
        }

        .progress-bar-bg {
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--live-red);
            border-radius: 4px;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px dashed var(--border);
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            .tv-grid.timeline-mode .card {
                flex-direction: column;
                align-items: flex-start;
            }
            .tv-grid.timeline-mode .card-header {
                flex-direction: row;
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TeleVibe<span>DE</span></div>
        <div class="live-clock" id="clock">00:00 Uhr</div>
    </header>

    <div class="controls-wrapper">
        <div class="scroll-row" id="dateScroll">
            <span class="row-label">Datum:</span>
        </div>

        <div class="scroll-row" id="timeScroll">
            <span class="row-label">Zeit:</span>
            <button class="btn active" onclick="setTimeFilter('jetzt', this)">🔴 Jetzt Live</button>
            <button class="btn" onclick="setTimeFilter('2015', this)">20:15 Uhr</button>
            <button class="btn" onclick="setTimeFilter('2200', this)">22:00 Uhr</button>
            <button class="btn" onclick="setTimeFilter('ganzer-tag', this)">Ganzer Tag</button>
        </div>

        <div class="scroll-row" id="channelScroll">
            <span class="row-label">Sender:</span>
            <button class="btn btn-channel active" onclick="setChannelFilter('all', this)">Alle 20 Sender</button>
        </div>
        
        <input type="text" id="searchInput" class="search-input" placeholder="Nach Sendung oder Sender suchen..." oninput="applyFilters()">
    </div>

    <main>
        <div class="section-header">
            <h2 class="section-title" id="sectionTitle">Lade Programm...</h2>
            <span class="show-count" id="showCount"></span>
        </div>
        <div class="tv-grid" id="tvGrid"></div>
    </main>

    <script>
        const channelOrder = [
            'Das Erste', 'ZDF', 'RTL', 'Sat.1', 'ProSieben', 'Kabel Eins', 'RTLZWEI', 'VOX', '3sat', 'Arte',
            'n-tv', 'WELT', 'DMAX', 'NITRO', 'ZDFneo', 'Sixx', 'Super RTL', 'KiKA', 'Phoenix', 'Tele 5'
        ];

        const timeSlots = [
            { start: '00:00', end: '05:30', type: 'night' },
            { start: '05:30', end: '10:00', type: 'morning' },
            { start: '10:00', end: '14:00', type: 'midday' },
            { start: '14:00', end: '17:00', type: 'afternoon' },
            { start: '17:00', end: '20:15', type: 'evening' },
            { start: '20:15', end: '22:15', type: 'prime' },
            { start: '22:15', end: '23:59', type: 'late' }
        ];

        let activeDateOffset = 0;
        let activeTimeFilter = 'jetzt';
        let activeChannel = 'all';
        let fullDatabase = [];

        function initUI() {
            const cScroll = document.getElementById('channelScroll');
            channelOrder.forEach(channel => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-channel';
                btn.innerText = channel;
                btn.onclick = function() { setChannelFilter(channel, this); };
                cScroll.appendChild(btn);
            });

            const dScroll = document.getElementById('dateScroll');
            const weekdays = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
            
            for(let i=0; i<5; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                
                let label = '';
                if(i === 0) label = 'Heute';
                else if(i === 1) label = 'Morgen';
                else {
                    const dayName = weekdays[d.getDay()];
                    const dayNum = String(d.getDate()).padStart(2, '0');
                    const monthNum = String(d.getMonth()+1).padStart(2, '0');
                    label = `${dayName}, ${dayNum}.${monthNum}.`;
                }

                const btn = document.createElement('button');
                btn.className = i === 0 ? 'btn active' : 'btn';
                btn.innerText = label;
                btn.onclick = function() { setDateFilter(i, this); };
                dScroll.appendChild(btn);
            }
        }

        function generateDatabase() {
            fullDatabase = [];
            for(let dayOffset=0; dayOffset<5; dayOffset++) {
                channelOrder.forEach(channel => {
                    timeSlots.forEach(slot => {
                        fullDatabase.push({
                            dayOffset: dayOffset,
                            channel: channel,
                            start: slot.start,
                            end: slot.end,
                            title: getShowTitle(channel, slot.type),
                            desc: getShowDesc(channel, slot.type)
                        });
                    });
                });
            }
        }

        function getShowTitle(channel, type) {
            const rules = {
                'Das Erste': { prime: 'Tatort', evening: 'Sportschau / Quiz', late: 'Tagesthemen', morning: 'Morgenmagazin' },
                'ZDF': { prime: 'Der Bergdoktor / Krimi', evening: 'SOKO / heute', late: 'heute journal', morning: 'ZDF-Morgenmagazin' },
                'RTL': { prime: 'Wer wird Millionär?', evening: 'GZSZ / RTL Aktuell', late: 'RTL Direkt', morning: 'Punkt 6' },
                'ProSieben': { prime: 'Blockbuster / Masked Singer', evening: 'Galileo / taff', late: 'Late Night Berlin', morning: 'Sitcoms' },
                'Sat.1': { prime: 'The Voice / Film', evening: 'Sat.1 Nachrichten', late: 'Reportage', morning: 'Frühstücksfernsehen' },
                'VOX': { prime: 'Die Höhle der Löwen', evening: 'Das perfekte Dinner', late: 'Doku', morning: 'CSI: Miami' }
            };

            const fallback = {
                night: 'Nachtprogramm / Wiederholungen',
                morning: 'Frühprogramm / Dokumentationen',
                midday: 'Mittagsmagazin / Serien',
                afternoon: 'Nachmittagsprogramm / Dokus',
                evening: 'Vorabendprogramm / Nachrichten',
                prime: 'Spielfilm / Hauptprogramm',
                late: 'Spätprogramm / Talk'
            };

            if(rules[channel] && rules[channel][type]) return rules[channel][type];
            return fallback[type];
        }

        function getShowDesc(channel, type) {
            if(type === 'prime') return 'Das Highlight zur besten Sendezeit.';
            if(type === 'late') return 'Spannende Themen und Hintergründe am späten Abend.';
            return `Reguläres Programm auf ${channel}.`;
        }

        function timeToMinutes(str) {
            const [h, m] = str.split(':').map(Number);
            return h * 60 + m;
        }

        function getCurrentMinutes() {
            const now = new Date();
            return now.getHours() * 60 + now.getMinutes();
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr';
        }
        setInterval(updateClock, 1000);

        function setDateFilter(offset, btn) {
            activeDateOffset = offset;
            document.querySelectorAll('#dateScroll .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(offset > 0 && activeTimeFilter === 'jetzt') {
                setTimeFilter('2015', document.querySelectorAll('#timeScroll .btn')[1]);
            } else {
                applyFilters();
            }
        }

        function setTimeFilter(type, btn) {
            activeTimeFilter = type;
            document.querySelectorAll('#timeScroll .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(type === 'jetzt' && activeDateOffset > 0) {
                setDateFilter(0, document.querySelectorAll('#dateScroll .btn')[0]);
            } else {
                applyFilters();
            }
        }

        function setChannelFilter(channel, btn) {
            activeChannel = channel;
            document.querySelectorAll('#channelScroll .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyFilters();
        }

        function applyFilters() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const titleEl = document.getElementById('sectionTitle');
            const nowMins = getCurrentMinutes();
            
            let result = fullDatabase.filter(s => s.dayOffset === activeDateOffset);
            const dateLabels = ['Heute', 'Morgen', 'Übermorgen', 'in 3 Tagen', 'in 4 Tagen'];
            let titlePrefix = dateLabels[activeDateOffset];

            if (activeTimeFilter === 'jetzt') {
                titleEl.innerText = "🔴 Jetzt Live im TV";
                result = result.filter(s => {
                    const start = timeToMinutes(s.start);
                    const end = timeToMinutes(s.end);
                    return nowMins >= start && nowMins < end;
                });
            } else if (activeTimeFilter === '2015') {
                titleEl.innerText = `${titlePrefix}: Prime-Time (20:15 Uhr)`;
                result = result.filter(s => timeToMinutes(s.start) <= 1215 && timeToMinutes(s.end) > 1215);
            } else if (activeTimeFilter === '2200') {
                titleEl.innerText = `${titlePrefix}: Spätprogramm (22:00 Uhr)`;
                result = result.filter(s => timeToMinutes(s.start) <= 1320 && timeToMinutes(s.end) > 1320);
            } else if (activeTimeFilter === 'ganzer-tag') {
                titleEl.innerText = `${titlePrefix}: Komplettes 24h-Programm`;
            }

            if (activeChannel !== 'all') {
                result = result.filter(s => s.channel === activeChannel);
            }

            if (searchVal.trim() !== '') {
                result = result.filter(s => 
                    s.title.toLowerCase().includes(searchVal) || 
                    s.channel.toLowerCase().includes(searchVal)
                );
            }

            result.sort((a, b) => {
                if (activeTimeFilter === 'ganzer-tag') {
                    const timeDiff = timeToMinutes(a.start) - timeToMinutes(b.start);
                    if (timeDiff !== 0) return timeDiff;
                }
                return channelOrder.indexOf(a.channel) - channelOrder.indexOf(b.channel);
            });

            renderGrid(result);
        }

        function renderGrid(shows) {
            const grid = document.getElementById('tvGrid');
            const countEl = document.getElementById('showCount');
            const nowMins = getCurrentMinutes();
            
            grid.innerHTML = '';
            countEl.innerText = `${shows.length} Sendung(en)`;

            // Schaltet automatisch den sauberen Listen-/Timeline-Modus ein, wenn "Ganzer Tag" gewählt ist
            if (activeTimeFilter === 'ganzer-tag') {
                grid.classList.add('timeline-mode');
            } else {
                grid.classList.remove('timeline-mode');
            }

            if (shows.length === 0) {
                grid.innerHTML = `<div class="no-results">Für diese Kombination wurden keine Sendungen gefunden.</div>`;
                return;
            }

            shows.forEach(show => {
                const startM = timeToMinutes(show.start);
                const endM = timeToMinutes(show.end);
                const isLive = (activeDateOffset === 0 && nowMins >= startM && nowMins < endM);
                
                let progressHTML = '';
                if (isLive && activeTimeFilter !== 'ganzer-tag') {
                    const totalDuration = endM - startM;
                    const elapsed = nowMins - startM;
                    const progressPercent = Math.min(100, Math.max(0, Math.round((elapsed / totalDuration) * 100)));
                    
                    progressHTML = `
                        <div class="progress-container">
                            <div class="progress-text">
                                <span class="live-indicator"><div class="live-dot"></div> Live</span>
                                <span>${progressPercent}%</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${progressPercent}%"></div>
                            </div>
                        </div>
                    `;
                }

                if (activeTimeFilter === 'ganzer-tag') {
                    // Kompakte Timeline-Ansicht für den ganzen Tag
                    const cardHTML = `
                        <div class="card">
                            <div class="card-header">
                                <span class="channel-name">${show.channel}</span>
                                <span class="time-badge">${show.start} - ${show.end}</span>
                            </div>
                            <div class="card-body-wrapper">
                                <div class="show-title" style="font-size: 1.05rem; margin-bottom: 0.1rem;">${show.title}</div>
                                <div class="show-desc">${show.desc}</div>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += cardHTML;
                } else {
                    // Normale Grid-Karten für andere Ansichten
                    const cardHTML = `
                        <div class="card">
                            <div class="card-header">
                                <span class="channel-name">${show.channel}</span>
                                <span class="time-badge">${show.start} - ${show.end}</span>
                            </div>
                            <div class="show-title">${show.title}</div>
                            <div class="show-desc">${show.desc}</div>
                            ${progressHTML}
                        </div>
                    `;
                    grid.innerHTML += cardHTML;
                }
            });
        }

        window.onload = () => {
            initUI();
            generateDatabase();
            updateClock();
            applyFilters();
        };
    </script>
</body>
</html>
