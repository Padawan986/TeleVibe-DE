<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleVibe DE | Echtes TV-Programm (API)</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* --- HEADER --- */
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .time-filters {
            display: flex;
            gap: 1rem;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.5rem 1.2rem;
            border-radius: 99px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--text-main);
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        /* --- CONTENT --- */
        main {
            padding: 2rem 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .loader {
            font-size: 1rem;
            color: var(--primary);
            display: none;
        }

        .tv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* --- CARDS --- */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-color: var(--primary);
        }

        .card-header {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .channel-name {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .badge {
            background: rgba(139, 92, 246, 0.2);
            color: #c084fc;
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .card-body {
            padding: 1.5rem;
            flex-grow: 1;
        }

        .show-time {
            color: var(--primary);
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .show-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }
        
        .episode-title {
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 0.8rem;
            font-style: italic;
        }

        .show-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .no-data {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px dashed var(--border);
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
            }
            .time-filters {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TeleVibe DE</div>
        <div class="time-filters">
            <button class="filter-btn active" onclick="filterProgram('jetzt', this)">Jetzt / Demnächst</button>
            <button class="filter-btn" onclick="filterProgram('2015', this)">20:15 Uhr</button>
            <button class="filter-btn" onclick="filterProgram('2200', this)">Ab 22:00 Uhr</button>
        </div>
    </header>

    <main>
        <h2 class="section-title">
            <span id="current-category">Das läuft aktuell</span>
            <span class="loader" id="loader">Lade Daten aus API...</span>
        </h2>
        <div class="tv-grid" id="tv-grid">
            <!-- Karten werden via JavaScript geladen -->
        </div>
    </main>

    <script>
        // TVMaze API URL für das deutsche Programm (heute)
        const API_URL = 'https://api.tvmaze.com/schedule?country=DE';
        let allShows = []; // Hier speichern wir die geladenen API-Daten

        // Daten beim Start laden
        async function fetchProgramData() {
            const loader = document.getElementById('loader');
            loader.style.display = 'block';
            
            try {
                const response = await fetch(API_URL);
                allShows = await response.json();
                
                // Initiale Ansicht rendern
                renderProgram('jetzt');
            } catch (error) {
                console.error("Fehler beim Laden der API:", error);
                document.getElementById('tv-grid').innerHTML = `
                    <div class="no-data">Verbindung zur TV-API fehlgeschlagen. Bitte lade die Seite neu.</div>
                `;
            } finally {
                loader.style.display = 'none';
            }
        }

        // Render-Logik (Filtert die echten Daten)
        function renderProgram(timeKey) {
            const grid = document.getElementById('tv-grid');
            const categoryTitle = document.getElementById('current-category');
            
            grid.innerHTML = ''; // Grid leeren
            
            // Aktuelle Uhrzeit berechnen (Format HH:MM)
            const now = new Date();
            const currentHour = String(now.getHours()).padStart(2, '0');
            const currentMinute = String(now.getMinutes()).padStart(2, '0');
            const currentTimeStr = `${currentHour}:${currentMinute}`;

            let filteredShows = [];

            // Filter anwenden
            if (timeKey === 'jetzt') {
                categoryTitle.innerText = "Jetzt / Demnächst im TV";
                // Alles was ab jetzt oder maximal 45 Minuten vorher gestartet ist, nehmen wir als "Jetzt"
                // Zur Vereinfachung: Wir nehmen Sendungen, die in der Zukunft liegen und cappen auf 12 Stück
                filteredShows = allShows
                    .filter(item => item.airtime >= currentTimeStr)
                    .slice(0, 15);
            } 
            else if (timeKey === '2015') {
                categoryTitle.innerText = "Prime-Time: 20:15 Uhr";
                // Genau 20:15 Uhr
                filteredShows = allShows.filter(item => item.airtime === '20:15');
            } 
            else if (timeKey === '2200') {
                categoryTitle.innerText = "Spätprogramm ab 22:00 Uhr";
                // Alles ab 22:00 Uhr
                filteredShows = allShows
                    .filter(item => item.airtime >= '22:00')
                    .slice(0, 15);
            }

            // Fallback, wenn keine Sendungen da sind
            if (filteredShows.length === 0) {
                grid.innerHTML = '<div class="no-data">Für diesen Zeitraum liegen aktuell keine Daten vor.</div>';
                return;
            }
            
            // Karten aus den API-Daten generieren
            filteredShows.forEach(item => {
                // TVMaze JSON sicher auslesen (manche Felder können null sein)
                const channel = item.show.network ? item.show.network.name : (item.show.webChannel ? item.show.webChannel.name : 'Unbekannt');
                const showTitle = item.show.name || 'Unbekannter Titel';
                const episodeTitle = item.name || '';
                const time = item.airtime || '--:--';
                
                // HTML-Tags aus der API-Beschreibung entfernen
                let desc = item.show.summary ? item.show.summary.replace(/<[^>]*>?/gm, '') : 'Keine genaue Beschreibung verfügbar.';

                const cardHTML = `
                    <div class="card">
                        <div class="card-header">
                            <span class="channel-name">${channel}</span>
                            <span class="badge">Live API</span>
                        </div>
                        <div class="card-body">
                            <div class="show-time">${time} Uhr</div>
                            <div class="show-title">${showTitle}</div>
                            ${episodeTitle ? `<div class="episode-title">${episodeTitle}</div>` : ''}
                            <div class="show-desc">${desc}</div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // Button Click Handler
        function filterProgram(timeKey, btnElement) {
            // Aktiven Button markieren
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            // Rendern
            renderProgram(timeKey);
        }

        // API Abruf beim Laden der Seite starten
        window.onload = () => {
            fetchProgramData();
        };
    </script>
</body>
</html>
