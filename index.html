<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleVibe DE | Dein TV-Guide für den ganzen Tag</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151d30;
            --bg-card-hover: #1c2742;
            --primary: #3b82f6;
            --accent: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #243049;
            --live-red: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 3rem;
        }

        /* --- HEADER --- */
        header {
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .live-clock {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: var(--primary);
            padding: 0.3rem 0.8rem;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* --- CONTROLS & FILTER SECTION --- */
        .controls-wrapper {
            padding: 1.5rem 5% 0.5rem 5%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .time-filters {
            display: flex;
            gap: 0.6rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            scrollbar-width: none;
        }

        .time-filters::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--text-main);
            transform: translateY(-1px);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
        }

        .search-channel-bar {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-input, .channel-select {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.7rem 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-input {
            flex: 1;
            min-width: 220px;
        }

        .search-input:focus, .channel-select:focus {
            border-color: var(--primary);
        }

        .channel-select option {
            background: var(--bg-card);
            color: var(--text-main);
        }

        /* --- MAIN GRID --- */
        main {
            padding: 1.5rem 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .show-count {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .tv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* --- CARD STYLING --- */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.25 ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            background: var(--bg-card-hover);
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .channel-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .channel-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
        }

        .channel-name {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .genre-badge {
            background: rgba(139, 92, 246, 0.15);
            color: #c084fc;
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .genre-badge.live {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border-color: rgba(239, 68, 68, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .card-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .show-time {
            color: var(--primary);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .show-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.35;
            color: var(--text-main);
        }

        .show-desc {
            color: var(--text-muted);
            font-size: 0.88rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .card-footer {
            margin-top: auto;
            padding-top: 0.8rem;
        }

        .progress-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .progress-bar-bg {
            height: 6px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 99px;
            transition: width 0.4s ease;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px dashed var(--border);
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }
            .search-channel-bar {
                flex-direction: column;
            }
            .search-input, .channel-select {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo">TeleVibe DE</div>
            <div class="live-clock" id="clock">00:00:00 Uhr</div>
        </div>
    </header>

    <div class="controls-wrapper">
        <div class="time-filters">
            <button class="filter-btn active" onclick="setFilter('jetzt', this)">🔴 Jetzt Live</button>
            <button class="filter-btn" onclick="setFilter('ganzer-tag', this)">📅 Ganzer Tag</button>
            <button class="filter-btn" onclick="setFilter('morgen', this)">☕ Morgens (06-12)</button>
            <button class="filter-btn" onclick="setFilter('nachmittag', this)">☀️ Nachmittags (12-18)</button>
            <button class="filter-btn" onclick="setFilter('2015', this)">⭐ Prime-Time (20:15)</button>
            <button class="filter-btn" onclick="setFilter('2200', this)">🌙 Spätprogramm (ab 22:00)</button>
        </div>

        <div class="search-channel-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 Sendung, Film oder Thema suchen..." oninput="applyFilters()">
            <select id="channelSelect" class="channel-select" onchange="applyFilters()">
                <option value="all">Alle Sender (ARD, ZDF, RTL, Pro7...)</option>

                <option value="ZDF">ZDF</option>
                <option value="RTL">RTL</option>
                <option value="ProSieben">ProSieben</option>
                <option value="Sat.1">Sat.1</option>
                <option value="VOX">VOX</option>
                <option value="Kabel Eins">Kabel Eins</option>
                <option value="Arte">Arte</option>
                <option value="ZDFneo">ZDFneo</option>
            </select>
        </div>
    </div>

    <main>
        <div class="section-header">

            <span class="show-count" id="showCount">0 Sendungen</span>

        <div class="tv-grid" id="tvGrid">
            </div>
    </main>

            { channel: 'Arte', title: 'Arte Journal', start: '19:20', end: '19:40', genre: 'News', desc: 'Europäische Perspektiven auf das Weltgeschehen.' },
            { channel: 'Arte', title: 'Faszination Erde: Island', start: '20:15', end: '21:10', genre: 'Doku', desc: 'Atemberaubende Naturaufnahmen von Vulkanen und Geysiren.' },
            { channel: 'Arte', title: 'Klassik im Quadrat', start: '22:00', end: '23:15', genre: 'Kultur', desc: 'Ein meisterhaftes Symphoniekonzert live aus Paris.' },

            // ZDFneo
            { channel: 'ZDFneo', title: 'Bares für Rares (Wdh.)', start: '18:30', end: '19:20', genre: 'Show', desc: 'Antiquitäten und Sammlerstücke.' },
            { channel: 'ZDFneo', title: 'Inspector Barnaby', start: '20:15', end: '21:45', genre: 'Krimi', desc: 'Mordfälle im malerischen Midsomer.' },
            { channel: 'ZDFneo', title: 'ZDF Magazin Royale', start: '22:00', end: '22:45', genre: 'Comedy', desc: 'Jan Böhmermann entlarvt Missstände mit scharfer Satire.' }

        let currentFilter = 'jetzt';

        // Echtzeit-Uhr
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('de-DE');
            document.getElementById('clock').innerText = timeStr + ' Uhr';
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Zeit in Minuten umrechnen (z.B. "20:15" -> 1215)
        function timeToMinutes(str) {
            if(!str) return 0;
            const [h, m] = str.split(':').map(Number);
            return h * 60 + m;
        }

        // Aktuelle Zeit in Minuten
        function getCurrentMinutes() {
            const now = new Date();
            return now.getHours() * 60 + now.getMinutes();
        }

        // Filter setzen
        function setFilter(type, btn) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyFilters();
        }

        // Haupt-Render und Filter-Funktion
        function applyFilters() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const channelVal = document.getElementById('channelSelect').value;
            const titleEl = document.getElementById('sectionTitle');
            const nowMins = getCurrentMinutes();

            let result = fullDaySchedule;

            // 1. Sender-Filter
            if (channelVal !== 'all') {
                result = result.filter(s => s.channel === channelVal);
            }

            // 2. Zeit-Filter
            if (currentFilter === 'jetzt') {
                titleEl.innerText = "Das läuft aktuell (Live)";
                result = result.filter(s => {
                    const startM = timeToMinutes(s.start);
                    const endM = timeToMinutes(s.end);
                    return nowMins >= startM && nowMins < endM;
                });
            } else if (currentFilter === 'morgen') {
                titleEl.innerText = "Programm Morgens (06:00 - 12:00 Uhr)";
                result = result.filter(s => timeToMinutes(s.start) >= 360 && timeToMinutes(s.start) < 720);
            } else if (currentFilter === 'nachmittag') {
                titleEl.innerText = "Programm Nachmittags (12:00 - 18:00 Uhr)";
                result = result.filter(s => timeToMinutes(s.start) >= 720 && timeToMinutes(s.start) < 1080);
            } else if (currentFilter === '2015') {
                titleEl.innerText = "Prime-Time (20:15 Uhr)";
                result = result.filter(s => s.start === '20:15');
            } else if (currentFilter === '2200') {
                titleEl.innerText = "Spätprogramm (ab 22:00 Uhr)";
                result = result.filter(s => timeToMinutes(s.start) >= 1320);
            } else if (currentFilter === 'ganzer-tag') {
                titleEl.innerText = "Gesamtes Tagesprogramm";
                // Nach Startzeit sortieren
                result.sort((a, b) => timeToMinutes(a.start) - timeToMinutes(b.start));
            }

            // 3. Suche
            if (searchVal.trim() !== '') {
                result = result.filter(s => 
                    s.title.toLowerCase().includes(searchVal) || 
                    s.desc.toLowerCase().includes(searchVal) ||
                    s.channel.toLowerCase().includes(searchVal) ||
                    s.genre.toLowerCase().includes(searchVal)
                );
            }

            renderGrid(result);
        }

        function renderGrid(shows) {
            const grid = document.getElementById('tvGrid');
            const countEl = document.getElementById('showCount');
            const nowMins = getCurrentMinutes();
            
            grid.innerHTML = '';
            countEl.innerText = `${shows.length} Sendungen`;

            if (shows.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        <h3>Keine Sendungen gefunden</h3>
                        <p style="margin-top:0.5rem">Versuche die Suche oder den Zeitfilter zurückzusetzen.</p>
                    </div>`;
                return;
            }

            shows.forEach(show => {
                const startM = timeToMinutes(show.start);
                const endM = timeToMinutes(show.end);
                const isLive = nowMins >= startM && nowMins < endM;
                
                // Live Fortschritt berechnen
                let progressPercent = 0;
                if (isLive) {
                    const totalDuration = endM - startM;
                    const elapsed = nowMins - startM;
                    progressPercent = Math.min(100, Math.max(0, Math.round((elapsed / totalDuration) * 100)));
                }

                const badgeHTML = isLive 
                    ? `<span class="genre-badge live">● LIVE (${progressPercent}%)</span>` 
                    : `<span class="genre-badge">${show.genre}</span>`;

                const progressHTML = isLive ? `
                    <div class="card-footer">
                        <div class="progress-wrapper">
                            <div class="progress-labels">
                                <span>Fortschritt</span>
                                <span>${progressPercent}%</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${progressPercent}%"></div>
                            </div>
                        </div>
                    </div>` : '';

                const cardHTML = `
                    <div class="card">
                        <div class="card-header">
                            <div class="channel-info">
                                <div class="channel-dot"></div>
                                <span class="channel-name">${show.channel}</span>
                            </div>
                            ${badgeHTML}
                        </div>
                        <div class="card-body">
                            <div class="show-time">🕒 ${show.start} - ${show.end} Uhr</div>
                            <div class="show-title">${show.title}</div>
                            <div class="show-desc">${show.desc}</div>
                            ${progressHTML}
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // Beim ersten Start ausführen
        window.onload = () => {
            applyFilters();
        };
    </script>
</body>
</html>
