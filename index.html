<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleVibe DE | Dein TV-Programm</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a; /* Tiefdunkles Blau für modernen Look */
            --card-bg: #1e293b;
            --primary: #3b82f6; /* Modernes Blau als Akzent */
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* --- HEADER & NAVIGATION --- */
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .time-filters {
            display: flex;
            gap: 1rem;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.5rem 1.2rem;
            border-radius: 99px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--text-main);
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        /* --- MAIN CONTENT & GRID --- */
        main {
            padding: 2rem 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        .tv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        /* --- TV CARDS --- */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border-color: var(--primary);
        }

        .card-header {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .channel-name {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .badge {
            background: rgba(59, 130, 246, 0.2);
            color: var(--primary);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge.live {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .card-body {
            padding: 1.5rem;
        }

        .show-time {
            color: var(--primary);
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }

        .show-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .show-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
            /* Beschränkung auf 2 Zeilen Text */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 99px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            border-radius: 99px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
            }
            .time-filters {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TeleVibe DE</div>
        <div class="time-filters">
            <button class="filter-btn active" onclick="filterProgram('jetzt', this)">Jetzt im TV</button>
            <button class="filter-btn" onclick="filterProgram('2015', this)">20:15 Uhr</button>
            <button class="filter-btn" onclick="filterProgram('2200', this)">22:00 Uhr</button>
        </div>
    </header>

    <main>
        <h2 class="section-title" id="current-category">Das läuft aktuell (Live)</h2>
        <div class="tv-grid" id="tv-grid">
            </div>
    </main>

    <script>
        // Realistische Mock-Daten für deutsche TV-Sender
        const programData = {
            'jetzt': [
                { channel: 'Das Erste', title: 'Tagesschau', time: '20:00 - 20:15', desc: 'Die wichtigsten Nachrichten des Tages aus Deutschland und der Welt.', progress: 75, isLive: true },
                { channel: 'ZDF', title: 'WISO', time: '19:25 - 20:15', desc: 'Wirtschaft und Soziales - Das Verbrauchermagazin im ZDF.', progress: 85, isLive: true },
                { channel: 'RTL', title: 'RTL Aktuell', time: '18:45 - 19:05', desc: 'Die neusten Nachrichten aus Politik, Wirtschaft und Gesellschaft.', progress: 100, isLive: false },
                { channel: 'ProSieben', title: 'Galileo', time: '19:05 - 20:15', desc: 'Das Wissensmagazin mit Aiman Abdallah. Spannende Reportagen und Experimente.', progress: 90, isLive: true },
                { channel: 'Sat.1', title: 'Sat.1 Nachrichten', time: '19:55 - 20:15', desc: 'Aktuelle News und Hintergründe.', progress: 40, isLive: true },
                { channel: 'VOX', title: 'Das perfekte Dinner', time: '19:00 - 20:15', desc: 'Hobbyköche laden zum Dreigänge-Menü in ihre eigenen vier Wände ein.', progress: 95, isLive: true }
            ],
            '2015': [
                { channel: 'Das Erste', title: 'Tatort: Dunkle Wege', time: '20:15 - 21:45', desc: 'Die Kommissare Batic und Leitmayr ermitteln in einem mysteriösen Mordfall in der Münchener High-Society.', progress: 0, isLive: false },
                { channel: 'ZDF', title: 'Der Bergdoktor', time: '20:15 - 21:45', desc: 'Dr. Martin Gruber steht vor einer schweren medizinischen Entscheidung. Emotionale Momente in den Alpen.', progress: 0, isLive: false },
                { channel: 'RTL', title: 'Wer wird Millionär?', time: '20:15 - 23:00', desc: 'Günther Jauch präsentiert die beliebte Quizshow. Schafft es heute jemand zur Million?', progress: 0, isLive: false },
                { channel: 'ProSieben', title: 'The Masked Singer', time: '20:15 - 23:30', desc: 'Wer steckt unter den spektakulären Masken? Das größte TV-Rätsel Deutschlands geht weiter.', progress: 0, isLive: false },
                { channel: 'Sat.1', title: 'Das große Backen', time: '20:15 - 22:30', desc: 'Deutschlands beste Hobbybäcker stellen sich neuen Herausforderungen unter den strengen Augen der Jury.', progress: 0, isLive: false },
                { channel: 'VOX', title: 'Die Höhle der Löwen', time: '20:15 - 22:45', desc: 'Gründer pitchen ihre innovativen Ideen vor knallharten Investoren, um einen Deal zu ergattern.', progress: 0, isLive: false }
            ],
            '2200': [
                { channel: 'Das Erste', title: 'Tagesthemen', time: '22:15 - 22:45', desc: 'Die wichtigsten Nachrichten des Tages mit Hintergrundberichten und Analysen.', progress: 0, isLive: false },
                { channel: 'ZDF', title: 'heute journal', time: '21:45 - 22:15', desc: 'Ausführliche Nachrichten und Hintergründe zu den Themen des Tages.', progress: 0, isLive: false },
                { channel: 'RTL', title: 'RTL Direkt', time: '22:15 - 22:35', desc: 'Das neue Nachrichtenmagazin mit Jan Hofer und Pinar Atalay.', progress: 0, isLive: false },
                { channel: 'ProSieben', title: 'Late Night Berlin', time: '23:30 - 00:30', desc: 'Klaas Heufer-Umlauf präsentiert die heißesten Themen, coole Gäste und Musik.', progress: 0, isLive: false },
                { channel: 'Kabel Eins', title: 'Matrix', time: '22:30 - 01:10', desc: 'Sci-Fi-Klassiker: Neo entdeckt, dass die Welt nur eine Computersimulation ist.', progress: 0, isLive: false },
                { channel: 'ZDFneo', title: 'Böhmermann', time: '22:00 - 22:30', desc: 'ZDF Magazin Royale: Satire, Musik und investigativer Journalismus.', progress: 0, isLive: false }
            ]
        };

        // Render-Funktion
        function renderProgram(timeKey) {
            const grid = document.getElementById('tv-grid');
            const categoryTitle = document.getElementById('current-category');
            
            // Setze Titel basierend auf der Zeit
            if(timeKey === 'jetzt') categoryTitle.innerText = "Das läuft aktuell (Live)";
            if(timeKey === '2015') categoryTitle.innerText = "Prime-Time: 20:15 Uhr";
            if(timeKey === '2200') categoryTitle.innerText = "Spätprogramm ab 22:00 Uhr";

            grid.innerHTML = ''; // Grid leeren

            const shows = programData[timeKey];
            
            shows.forEach(show => {
                const badge = show.isLive ? '<span class="badge live">Live</span>' : '<span class="badge">Tipp</span>';
                const progressHTML = show.progress > 0 ? `
                    <div class="progress-container">
                        <div class="progress-bar" style="width: ${show.progress}%"></div>
                    </div>` : '';

                const cardHTML = `
                    <div class="card">
                        <div class="card-header">
                            <span class="channel-name">${show.channel}</span>
                            ${badge}
                        </div>
                        <div class="card-body">
                            <div class="show-time">${show.time}</div>
                            <div class="show-title">${show.title}</div>
                            <div class="show-desc">${show.desc}</div>
                            ${progressHTML}
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // Filter-Logik für die Buttons
        function filterProgram(timeKey, btnElement) {
            // Aktiven State bei Buttons anpassen
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            // Neues Programm rendern
            renderProgram(timeKey);
        }

        // Initiale Ladung der "Jetzt" Seite
        window.onload = () => {
            renderProgram('jetzt');
        };
    </script>
</body>
</html>
