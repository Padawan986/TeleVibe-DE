<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleVibe DE | Dein TV-Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #09090b; /* Sehr dunkles Grau/Schwarz für edlen OLED-Look */
            --bg-card: #18181b;
            --bg-card-hover: #27272a;
            --primary: #3b82f6;
            --accent: #60a5fa;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --border: #27272a;
            --live-red: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 3rem;
            -webkit-font-smoothing: antialiased;
        }

        /* --- HEADER --- */
        header {
            background: rgba(9, 9, 11, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .logo span {
            color: var(--primary);
        }

        .live-clock {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        /* --- CONTROLS --- */
        .controls-wrapper {
            padding: 1.5rem 5% 0;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .time-filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .filter-btn.active {
            background: var(--text-main);
            color: var(--bg-main);
            border-color: var(--text-main);
            font-weight: 600;
        }

        .search-wrapper {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        /* --- CHANNEL BAR --- */
        .channel-scroll {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            scrollbar-width: none; /* Firefox */
        }

        .channel-scroll::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .channel-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.4rem 1.2rem;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .channel-btn:hover {
            background: var(--bg-card);
        }

        .channel-btn.active {
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* --- MAIN GRID --- */
        main {
            padding: 1.5rem 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-header {
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .show-count {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .tv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        /* --- CARDS --- */
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: var(--text-muted);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .channel-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .time-badge {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
            background: var(--bg-main);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .show-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            line-height: 1.3;
            color: var(--text-main);
        }

        .show-desc {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Kürzer für bessere Übersicht */
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        /* --- PROGRESS BAR (Für Live-Sendungen) --- */
        .progress-container {
            margin-top: auto;
        }
        
        .progress-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.3rem;
        }

        .live-indicator {
            color: var(--live-red);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: var(--live-red);
            border-radius: 50%;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        .progress-bar-bg {
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--live-red);
            border-radius: 4px;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px dashed var(--border);
        }

        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .search-wrapper {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">TeleVibe<span>DE</span></div>
        <div class="live-clock" id="clock">00:00 Uhr</div>
    </header>

    <div class="controls-wrapper">
        <div class="top-bar">
            <!-- Zeitfilter -->
            <div class="time-filters">
                <button class="filter-btn active" onclick="setTimeFilter('jetzt', this)">Jetzt Live</button>
                <button class="filter-btn" onclick="setTimeFilter('2015', this)">20:15 Uhr</button>
                <button class="filter-btn" onclick="setTimeFilter('2200', this)">Ab 22:00 Uhr</button>
                <button class="filter-btn" onclick="setTimeFilter('ganzer-tag', this)">Ganzer Tag</button>
            </div>
            
            <!-- Sucheingabe (sucht nach Titel UND Sender) -->
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-input" placeholder="Titel oder Sender suchen..." oninput="applyFilters()">
            </div>
        </div>

        <!-- Scrollbare Sender-Leiste (TV Spielfilm Reihenfolge) -->
        <div class="channel-scroll" id="channelScroll">
            <button class="channel-btn active" onclick="setChannelFilter('all', this)">Alle Sender</button>
            <!-- Sender werden via JS generiert um die Sortierung beizubehalten -->
        </div>
    </div>

    <main>
        <div class="section-header">
            <h2 class="section-title" id="sectionTitle">Jetzt Live</h2>
            <span class="show-count" id="showCount">Lade Daten...</span>
        </div>

        <div class="tv-grid" id="tvGrid">
            <!-- Karten -->
        </div>
    </main>

    <script>
        // Exakte TV Spielfilm Reihenfolge
        const channelOrder = [
            'Das Erste', 
            'ZDF', 
            'RTL', 
            'Sat.1', 
            'ProSieben', 
            'Kabel Eins', 
            'RTLZWEI', 
            'VOX', 
            '3sat', 
            'Arte'
        ];

        // Generiere die Sender-Buttons im HTML basierend auf dem Array
        const channelScroll = document.getElementById('channelScroll');
        channelOrder.forEach(channel => {
            const btn = document.createElement('button');
            btn.className = 'channel-btn';
            btn.innerText = channel;
            btn.onclick = function() { setChannelFilter(channel, this); };
            channelScroll.appendChild(btn);
        });

        // Mock-Daten, erweitert um RTLZWEI und 3sat, angepasst für 24h Übersicht
        const fullDaySchedule = [
            // Das Erste
            { channel: 'Das Erste', title: 'Brisant', start: '17:15', end: '18:00', desc: 'Boulevard- und Promimagazin mit aktuellen News aus aller Welt.' },
            { channel: 'Das Erste', title: 'Wer weiß denn sowas?', start: '18:00', end: '18:50', desc: 'Kai Pflaume moderiert das schlaue Wissensspiel.' },
            { channel: 'Das Erste', title: 'Tagesschau', start: '20:00', end: '20:15', desc: 'Die wichtigsten Nachrichten des Tages.' },
            { channel: 'Das Erste', title: 'Tatort: Dunkle Wege', start: '20:15', end: '21:45', desc: 'Die Kommissare Batic und Leitmayr ermitteln in einem mysteriösen Mordfall.' },
            { channel: 'Das Erste', title: 'Tagesthemen', start: '21:45', end: '22:15', desc: 'Nachrichten, Hintergrundberichte und Kommentare.' },
            { channel: 'Das Erste', title: 'Polizeiruf 110', start: '22:15', end: '23:45', desc: 'Spannender Krimi aus Rostock.' },

            // ZDF
            { channel: 'ZDF', title: 'SOKO Leipzig', start: '18:00', end: '19:00', desc: 'Ermittlungsarbeit in Sachsen.' },
            { channel: 'ZDF', title: 'heute', start: '19:00', end: '19:25', desc: 'Nachrichten.' },
            { channel: 'ZDF', title: 'Der Bergdoktor', start: '20:15', end: '21:45', desc: 'Dr. Martin Gruber steht vor einer schweren medizinischen Entscheidung.' },
            { channel: 'ZDF', title: 'heute journal', start: '21:45', end: '22:15', desc: 'Ausführliche Berichte und Analysen.' },
            { channel: 'ZDF', title: 'maybrit illner', start: '22:15', end: '23:15', desc: 'Politischer Talk mit hochkarätigen Gästen.' },

            // RTL
            { channel: 'RTL', title: 'RTL Aktuell', start: '18:45', end: '19:05', desc: 'Nachrichten.' },
            { channel: 'RTL', title: 'Gute Zeiten, schlechte Zeiten', start: '19:40', end: '20:15', desc: 'Deutschlands erfolgreichste Daily-Soap.' },
            { channel: 'RTL', title: 'Wer wird Millionär?', start: '20:15', end: '22:15', desc: 'Quizshow mit Günther Jauch.' },
            { channel: 'RTL', title: 'RTL Direkt', start: '22:15', end: '22:35', desc: 'Kompakte News am späten Abend.' },

            // Sat.1
            { channel: 'Sat.1', title: 'Die Ruhrpottwache', start: '18:00', end: '19:55', desc: 'Polizeialltag in Duisburg.' },
            { channel: 'Sat.1', title: 'Sat.1 Nachrichten', start: '19:55', end: '20:15', desc: 'News des Tages.' },
            { channel: 'Sat.1', title: 'The Voice of Germany', start: '20:15', end: '23:00', desc: 'Blind Auditions: Die Suche nach der besten Stimme.' },

            // ProSieben
            { channel: 'ProSieben', title: 'taff', start: '17:00', end: '18:00', desc: 'Boulevardmagazin.' },
            { channel: 'ProSieben', title: 'Galileo', start: '19:05', end: '20:15', desc: 'Wissen verständlich und unterhaltsam erklärt.' },
            { channel: 'ProSieben', title: 'The Masked Singer', start: '20:15', end: '23:30', desc: 'Wer steckt unter den Masken? Das Musik-Rätsel.' },

            // Kabel Eins
            { channel: 'Kabel Eins', title: 'Mein Lokal, Dein Lokal', start: '17:55', end: '18:55', desc: 'Gastronomen im Wettstreit.' },
            { channel: 'Kabel Eins', title: 'Achtung Kontrolle!', start: '18:55', end: '20:15', desc: 'Einsatzkräfte im Arbeitsalltag.' },
            { channel: 'Kabel Eins', title: 'Matrix', start: '20:15', end: '23:00', desc: 'Sci-Fi Klassiker mit Keanu Reeves.' },

            // RTLZWEI
            { channel: 'RTLZWEI', title: 'Köln 50667', start: '18:05', end: '19:05', desc: 'Geschichten aus der Domstadt.' },
            { channel: 'RTLZWEI', title: 'Berlin - Tag & Nacht', start: '19:05', end: '20:15', desc: 'Der Alltag in der angesagten Hauptstadt-WG.' },
            { channel: 'RTLZWEI', title: 'Frauentausch', start: '20:15', end: '22:15', desc: 'Zwei Frauen tauschen für zehn Tage ihre Familien.' },

            // VOX
            { channel: 'VOX', title: 'First Dates', start: '18:00', end: '19:00', desc: 'Roland Trettl öffnet sein Restaurant für Singles.' },
            { channel: 'VOX', title: 'Das perfekte Dinner', start: '19:00', end: '20:15', desc: 'Fünf Hobbyköche treten gegeneinander an.' },
            { channel: 'VOX', title: 'Die Höhle der Löwen', start: '20:15', end: '23:00', desc: 'Start-ups pitchen vor knallharten Investoren.' },

            // 3sat
            { channel: '3sat', title: 'nano', start: '18:30', end: '19:00', desc: 'Das Zukunftsmagazin.' },
            { channel: '3sat', title: 'Kulturzeit', start: '19:20', end: '20:00', desc: 'Das werktägliche Kulturmagazin.' },
            { channel: '3sat', title: 'Wissenschaftsdoku', start: '20:15', end: '21:00', desc: 'Tiefe Einblicke in Forschung und Technik.' },

            // Arte
            { channel: 'Arte', title: 'Arte Journal', start: '19:20', end: '19:40', desc: 'Europäische Perspektiven.' },
            { channel: 'Arte', title: 'Faszination Erde', start: '20:15', end: '21:45', desc: 'Naturdoku über die Landschaften Islands.' }
        ];

        // State
        let activeTimeFilter = 'jetzt';
        let activeChannel = 'all';

        // Uhrzeit aktualisieren
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('clock').innerText = timeStr + ' Uhr';
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Helfer: "HH:MM" zu Minuten seit 00:00
        function timeToMinutes(str) {
            const [h, m] = str.split(':').map(Number);
            return h * 60 + m;
        }

        function getCurrentMinutes() {
            const now = new Date();
            return now.getHours() * 60 + now.getMinutes();
        }

        // Filter Controls
        function setTimeFilter(type, btn) {
            activeTimeFilter = type;
            document.querySelectorAll('.time-filters .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyFilters();
        }

        function setChannelFilter(channel, btn) {
            activeChannel = channel;
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyFilters();
        }

        // Hauptlogik: Filtern und Sortieren
        function applyFilters() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const titleEl = document.getElementById('sectionTitle');
            const nowMins = getCurrentMinutes();
            
            let result = [...fullDaySchedule];

            // 1. Zeit filtern
            if (activeTimeFilter === 'jetzt') {
                titleEl.innerText = "Jetzt Live";
                result = result.filter(s => {
                    const start = timeToMinutes(s.start);
                    const end = timeToMinutes(s.end);
                    return nowMins >= start && nowMins < end;
                });
            } else if (activeTimeFilter === '2015') {
                titleEl.innerText = "Prime-Time (20:15 Uhr)";
                result = result.filter(s => s.start === '20:15');
            } else if (activeTimeFilter === '2200') {
                titleEl.innerText = "Spätprogramm (ab 22:00 Uhr)";
                result = result.filter(s => timeToMinutes(s.start) >= 1320); // 22:00 = 1320 mins
            } else {
                titleEl.innerText = "Gesamtes Tagesprogramm";
            }

            // 2. Sender filtern
            if (activeChannel !== 'all') {
                result = result.filter(s => s.channel === activeChannel);
            }

            // 3. Text Suche (Titel oder Sender)
            if (searchVal.trim() !== '') {
                result = result.filter(s => 
                    s.title.toLowerCase().includes(searchVal) || 
                    s.channel.toLowerCase().includes(searchVal)
                );
            }

            // 4. Sortieren (Immer nach TV Spielfilm Logik)
            result.sort((a, b) => {
                // Wenn "Ganzer Tag" aktiv ist, sortiere zuerst nach Uhrzeit
                if (activeTimeFilter === 'ganzer-tag') {
                    const timeDiff = timeToMinutes(a.start) - timeToMinutes(b.start);
                    if (timeDiff !== 0) return timeDiff;
                }
                
                // Danach (oder primär) nach TV Spielfilm Hierarchie sortieren
                const indexA = channelOrder.indexOf(a.channel);
                const indexB = channelOrder.indexOf(b.channel);
                
                // Fallback, falls ein Sender nicht in der Liste ist (nach hinten schieben)
                const rankA = indexA !== -1 ? indexA : 999;
                const rankB = indexB !== -1 ? indexB : 999;
                
                return rankA - rankB;
            });

            renderGrid(result);
        }

        // HTML Rendern
        function renderGrid(shows) {
            const grid = document.getElementById('tvGrid');
            const countEl = document.getElementById('showCount');
            const nowMins = getCurrentMinutes();
            
            grid.innerHTML = '';
            countEl.innerText = `${shows.length} Sendungen`;

            if (shows.length === 0) {
                grid.innerHTML = `
                    <div class="no-results">
                        Keine passenden Sendungen gefunden.
                    </div>`;
                return;
            }

            shows.forEach(show => {
                const startM = timeToMinutes(show.start);
                const endM = timeToMinutes(show.end);
                const isLive = (nowMins >= startM && nowMins < endM);
                
                let progressHTML = '';
                
                if (isLive) {
                    const totalDuration = endM - startM;
                    const elapsed = nowMins - startM;
                    const progressPercent = Math.min(100, Math.max(0, Math.round((elapsed / totalDuration) * 100)));
                    
                    progressHTML = `
                        <div class="progress-container">
                            <div class="progress-text">
                                <span class="live-indicator"><div class="live-dot"></div> Live</span>
                                <span>${progressPercent}%</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${progressPercent}%"></div>
                            </div>
                        </div>
                    `;
                }

                const cardHTML = `
                    <div class="card">
                        <div class="card-header">
                            <span class="channel-name">${show.channel}</span>
                            <span class="time-badge">${show.start} - ${show.end}</span>
                        </div>
                        <div class="show-title">${show.title}</div>
                        <div class="show-desc">${show.desc}</div>
                        ${progressHTML}
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // Init
        window.onload = applyFilters;
    </script>
</body>
</html>
